<!DOCTYPE html>
<html>

<head>
    <title>chikara Limited Company</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f3f7ff, #e0f7fa);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            padding: 25px;
            border: 1px solid #dce7ff;
        }

        h2 {
            margin: 0 0 20px;
            padding: 12px 16px;
            background: #2f6fed;
            border-radius: 10px;
        }

        h2 a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin-right: 10px;
            transition: 0.3s ease;
        }

        h2 a:hover {
            color: #ffd700;
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #f9fbff;
            overflow: hidden;
            border-radius: 12px;
        }

        th,
        td {
            border: 1px solid #d7e1f4;
            padding: 12px 10px;
            text-align: center;
        }

        th {
            background: #eaf2ff;
            color: #123a7a;
        }

        tr:nth-child(even) {
            background: #f5faff;
        }

        tr:hover {
            background: #e7f1ff;
            transition: 0.3s ease;
        }

        .footer {
            margin-top: 25px;
            padding: 14px 18px;
            background: #f2f7ff;
            border: 1px solid #d8e6ff;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer a {
            color: #0f5bd8;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .cart-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .cart-btn:hover {
            background: #1f8d3c;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>
            <a href="#">Home</a> |
            <a href="#">Subject</a> |
            <a href="#">Payment</a> |
            <a href="#">Login</a>
        </h2>
        
        <table>
            <tr>
                <th>S.No</th>
                <th>Subject</th>
                <th>Price</th>
                <th>Book</th>
                <th>Add to Cart</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Physics</td>
                <td>350</td>
                <td>1</td>
                <td><button class="cart-btn">Click me</button></td>
            </tr>
            <tr>
                <td>2</td>
                <td>Chemistry</td>
                <td>450</td>
                <td>2</td>
                <td><button class="cart-btn">Click me</button></td>
            </tr>
            <tr>
                <td>3</td>
                <td>Biology</td>
                <td>200</td>
                <td>3</td>
                <td><button class="cart-btn">Click me</button></td>
            </tr>
            <tr>
                <td>4</td>
                <td>Maths</td>
                <td>300</td>
                <td>4</td>
                <td><button class="cart-btn">Click me</button></td>
            </tr>
            <tr>
                <td>5</td>
                <td>English</td>
                <td>400</td>
                <td>5</td>
                <td><button class="cart-btn">Click me</button></td>
            </tr>
        </table>

        <div class="footer">
            <div><b>Logo</b> chikara Limited Company</div>
            <a href="https://maps.google.com" target="_blank">Location (Google Map)</a>
        </div>
    </div>
</body>

</html>
